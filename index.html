<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <title>Receipt Capture</title>
  <style>
    :root {
      --bg: #eef0ee;
      --card: #ffffff;
      --ink: #0f1f1b;
      --ink-2: #3a4e49;
      --line: #d9ddd9;
      --gold: #a07800;
      --accent: #1e7d5a;
      --accent-press: #186348;
      --accent-light: rgba(30, 125, 90, 0.1);
      --red: #c0392b;
      --radius: 16px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      padding: 18px 20px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .title-badge {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      padding: 6px 12px;
      border-radius: 100px;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-label {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--ink-2);
      padding: 0 2px;
      margin-bottom: -4px;
    }

    /* ── Capture zone ─────────────────────────────── */
    .capture-zone {
      position: relative;
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .capture-zone:active { border-color: var(--accent); }
    .capture-zone.has-image { border-style: solid; border-color: var(--accent); }

    .capture-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--ink-2);
      pointer-events: none;
      padding: 24px;
    }

    .capture-icon {
      width: 76px;
      height: 76px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .capture-label {
      font-size: 1.17rem;
      font-weight: 700;
      color: var(--ink);
    }

    .capture-sub {
      font-size: 1rem;
      color: var(--ink-2);
      text-align: center;
      line-height: 1.5;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #fileInput { display: none; }

    /* ── Buttons ──────────────────────────────────── */
    .action-bar { display: flex; gap: 12px; }

    .btn {
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 1.11rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }
    .btn:active { transform: scale(0.985); }

    .btn-primary {
      flex: 2;
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:active { background: var(--accent-press); }
    .btn-primary:disabled { background: #b8c2be; color: #eef0ee; cursor: not-allowed; }

    .btn-secondary {
      flex: 1;
      background: var(--card);
      color: var(--ink-2);
      border: 1.5px solid var(--line);
    }

    /* ── Edit card ────────────────────────────────── */
    .edit-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
      box-shadow: 0 2px 12px rgba(15, 31, 27, 0.06);
    }
    .edit-card.visible { display: block; animation: slideUp 0.3s ease-out; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Big glanceable amount — editable */
    .amount-hero {
      padding: 22px 20px 18px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .amount-hero-label {
      font-size: 0.83rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-2);
      margin-bottom: 8px;
    }
    .amount-input {
      font-size: 3rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-align: center;
      border: none;
      border-bottom: 2px solid var(--line);
      background: transparent;
      width: 100%;
      outline: none;
      font-family: var(--sans);
      padding-bottom: 4px;
    }
    .amount-input:focus { border-bottom-color: var(--accent); }

    .edit-hint {
      font-size: 0.78rem;
      color: var(--ink-2);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Field rows — editable */
    .field-list { padding: 0; }

    .field-row {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      gap: 6px;
    }
    .field-row:last-child { border-bottom: none; }

    .field-key {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-2);
    }

    .field-input {
      font-size: 1.06rem;
      font-weight: 600;
      color: var(--ink);
      border: none;
      border-bottom: 1.5px solid var(--line);
      background: transparent;
      outline: none;
      font-family: var(--sans);
      padding: 4px 0 6px;
      width: 100%;
      transition: border-color 0.15s;
    }
    .field-input:focus { border-bottom-color: var(--accent); }

    .field-select {
      font-size: 1.06rem;
      font-weight: 600;
      color: var(--ink);
      border: none;
      border-bottom: 1.5px solid var(--line);
      background: transparent;
      outline: none;
      font-family: var(--sans);
      padding: 4px 0 6px;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .field-select:focus { border-bottom-color: var(--accent); }

    /* Meals extra fields — hidden until category = Meals */
    .meals-fields {
      display: none;
      background: rgba(30, 125, 90, 0.04);
      border-top: 1px solid var(--line);
    }
    .meals-fields.visible { display: block; }

    .meals-banner {
      padding: 10px 20px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--accent-light);
      border-bottom: 1px solid var(--line);
    }

    /* Save button inside card */
    .save-row {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
    }

    .btn-save {
      width: 100%;
      padding: 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 1.17rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    .btn-save:active { background: var(--accent-press); transform: scale(0.985); }
    .btn-save:disabled { background: #b8c2be; cursor: not-allowed; }

    /* ── Processing overlay ───────────────────────── */
    .processing-overlay {
      position: fixed;
      inset: 0;
      background: rgba(238, 240, 238, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
    .processing-overlay.active { display: flex; }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-text {
      font-size: 1.11rem;
      font-weight: 700;
      color: var(--ink);
    }

    /* ── Toast ────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--ink);
      color: #fff;
      border-radius: 100px;
      padding: 16px 26px;
      font-size: 1.06rem;
      font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 31, 27, 0.25);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--accent); }
    .toast.error { background: var(--red); }
  </style>
</head>
<body>

<header>
  <span class="title">Receipts</span>
  <span class="title-badge">Snap &amp; Save</span>
</header>

<main>
  <div class="section-label">Snap a receipt</div>

  <div class="capture-zone" id="captureZone" onclick="document.getElementById('fileInput').click()">
    <img id="preview" alt="Receipt preview" />
    <div class="capture-placeholder" id="placeholder">
      <div class="capture-icon">📷</div>
      <div class="capture-label">Tap to take a photo</div>
      <div class="capture-sub">Point at the receipt and snap,<br>or pick one from your library</div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" />

  <div class="action-bar">
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
    <button class="btn btn-primary" id="extractBtn" onclick="extractReceipt()" disabled>
      Read Receipt
    </button>
  </div>

  <!-- Editable fields shown after extraction -->
  <div class="edit-card" id="editCard">

    <!-- Editable amount hero -->
    <div class="amount-hero">
      <div class="amount-hero-label">Total Paid</div>
      <input class="amount-input" id="f_total" type="number" step="0.01" placeholder="0.00" />
      <div class="edit-hint">✏️ All fields are editable — review before saving</div>
    </div>

    <div class="field-list">

      <div class="field-row">
        <label class="field-key" for="f_date">Date</label>
        <input class="field-input" id="f_date" type="date" />
      </div>

      <div class="field-row">
        <label class="field-key" for="f_establishment">Establishment</label>
        <input class="field-input" id="f_establishment" type="text" placeholder="Business name" />
      </div>

      <div class="field-row">
        <label class="field-key" for="f_location">Location</label>
        <input class="field-input" id="f_location" type="text" placeholder="City, State" />
      </div>

      <div class="field-row">
        <label class="field-key" for="f_category">Category</label>
        <select class="field-select" id="f_category" onchange="handleCategoryChange()">
          <option value="Meals">Meals</option>
          <option value="Travel">Travel</option>
          <option value="Lodging">Lodging</option>
          <option value="Office Supplies">Office Supplies</option>
          <option value="Other">Other</option>
        </select>
      </div>

    </div>

    <!-- IRS meal fields — shown only when category = Meals -->
    <div class="meals-fields" id="mealsFields">
      <div class="meals-banner">📋 IRS Required — Business Meals</div>

      <div class="field-row">
        <label class="field-key" for="f_attendees">Attendees</label>
        <input class="field-input" id="f_attendees" type="text" placeholder="Names and titles/relationship" />
      </div>

      <div class="field-row" style="border-bottom:none;">
        <label class="field-key" for="f_purpose">Business Purpose</label>
        <input class="field-input" id="f_purpose" type="text" placeholder="e.g. Sales meeting with prospective client" />
      </div>
    </div>

    <div class="field-list" style="border-top: 1px solid var(--line);">
      <div class="field-row" style="border-bottom:none;">
        <label class="field-key" for="f_notes">Notes</label>
        <input class="field-input" id="f_notes" type="text" placeholder="e.g. Client paid half, billable to project X" />
      </div>
    </div>

    <div class="save-row">
      <button class="btn-save" id="saveBtn" onclick="saveToSheet()">
        Save to Sheet
      </button>
    </div>

  </div>
</main>

<div class="processing-overlay" id="overlay">
  <div class="spinner"></div>
  <div class="processing-text" id="overlayText">Reading receipt...</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─────────────────────────────────────────────────────
  // PASTE YOUR APPS SCRIPT WEB APP URL HERE
  // ─────────────────────────────────────────────────────
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwV9TmneC1U9xRmbsufcc7FBx4VWo8QsSwlc4HiNqCgW4LVDNFVZ_T5Szajy2whBA0E/exec';
  // ─────────────────────────────────────────────────────

  let currentImageBase64 = null;
  let currentMimeType = null;
  let driveLink = null; // set after Drive upload

  // ── Image handling ──────────────────────────────────
  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    currentMimeType = file.type || 'image/jpeg';

    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      currentImageBase64 = dataUrl.split(',')[1];

      document.getElementById('preview').src = dataUrl;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('captureZone').classList.add('has-image');
      document.getElementById('extractBtn').disabled = false;
      document.getElementById('editCard').classList.remove('visible');
      driveLink = null;
    };
    reader.readAsDataURL(file);
  }

  function clearAll() {
    currentImageBase64 = null;
    currentMimeType = null;
    driveLink = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('captureZone').classList.remove('has-image');
    document.getElementById('extractBtn').disabled = true;
    document.getElementById('editCard').classList.remove('visible');
    document.getElementById('fileInput').value = '';
  }

  // ── Category toggle ─────────────────────────────────
  function handleCategoryChange() {
    const cat = document.getElementById('f_category').value;
    const meals = document.getElementById('mealsFields');
    if (cat === 'Meals') {
      meals.classList.add('visible');
    } else {
      meals.classList.remove('visible');
    }
  }

  // ── Step 1: Extract only (Claude + Drive upload) ────
  async function extractReceipt() {
    if (!currentImageBase64) return;
    if (APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
      showToast('Set your Apps Script URL first', 'error');
      return;
    }

    showOverlay('Reading receipt...');

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'extract',
          image: currentImageBase64,
          mimeType: currentMimeType
        }),
        headers: { 'Content-Type': 'text/plain' }
      });

      const result = await response.json();
      if (result.error) throw new Error(result.error);

      driveLink = result.driveLink;
      populateFields(result.data);
      document.getElementById('editCard').classList.add('visible');
      showToast('Review and save when ready', '');

    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      hideOverlay();
    }
  }

  // ── Populate editable fields ────────────────────────
  function populateFields(data) {
    document.getElementById('f_total').value = data.total ? parseFloat(data.total).toFixed(2) : '';
    document.getElementById('f_date').value = data.date || '';
    document.getElementById('f_establishment').value = data.establishment || '';
    document.getElementById('f_location').value = data.location || '';

    const catSelect = document.getElementById('f_category');
    const cats = ['Meals','Travel','Lodging','Office Supplies','Other'];
    catSelect.value = cats.includes(data.category) ? data.category : 'Other';

    // Clear meal fields
    document.getElementById('f_attendees').value = '';
    document.getElementById('f_purpose').value = '';
    document.getElementById('f_notes').value = '';

    handleCategoryChange();
  }

  // ── Step 2: Save edited data to Sheet ──────────────
  async function saveToSheet() {
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const category = document.getElementById('f_category').value;
    const isMeals = category === 'Meals';

    // Validate meal fields
    if (isMeals) {
      const attendees = document.getElementById('f_attendees').value.trim();
      const purpose = document.getElementById('f_purpose').value.trim();
      if (!attendees || !purpose) {
        showToast('Attendees and Business Purpose required for meals', 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save to Sheet';
        return;
      }
    }

    const payload = {
      action: 'save',
      driveLink: driveLink || '',
      data: {
        date: document.getElementById('f_date').value,
        establishment: document.getElementById('f_establishment').value,
        total: document.getElementById('f_total').value,
        location: document.getElementById('f_location').value,
        category: category,
        attendees: isMeals ? document.getElementById('f_attendees').value : '',
        purpose: isMeals ? document.getElementById('f_purpose').value : '',
        notes: document.getElementById('f_notes').value,
      }
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain' }
      });

      const result = await response.json();
      if (result.error) throw new Error(result.error);

      showToast('Saved to sheet ✓', 'success');
      setTimeout(() => clearAll(), 1800);

    } catch (err) {
      showToast('Error: ' + err.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save to Sheet';
    }
  }

  // ── Overlay helpers ─────────────────────────────────
  function showOverlay(msg) {
    document.getElementById('overlayText').textContent = msg;
    document.getElementById('overlay').classList.add('active');
  }
  function hideOverlay() {
    document.getElementById('overlay').classList.remove('active');
  }

  // ── Toast ───────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
