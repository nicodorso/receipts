<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <title>Receipt Capture</title>
  <style>
    :root {
      /* High-contrast palette — legibility first */
      --bg: #eef0ee;
      --card: #ffffff;
      --ink: #0f1f1b;        /* near-black, 16:1 on white */
      --ink-2: #3a4e49;      /* secondary, 7:1 on white */
      --line: #d9ddd9;
      --gold: #a07800;       /* dollar amounts on white, 4.6:1 */
      --gold-bright: #f5c842;
      --accent: #1e7d5a;     /* action green */
      --accent-press: #186348;
      --red: #c0392b;
      --radius: 16px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 18px; }            /* larger base — everything scales up */

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────── */
    header {
      width: 100%;
      padding: 18px 20px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-size: 1.5rem;       /* 27px */
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .title-badge {
      font-size: 0.83rem;      /* 15px */
      font-weight: 600;
      color: var(--accent);
      background: rgba(30, 125, 90, 0.1);
      padding: 6px 12px;
      border-radius: 100px;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-label {
      font-size: 0.94rem;      /* 17px */
      font-weight: 700;
      color: var(--ink-2);
      padding: 0 2px;
      margin-bottom: -4px;
    }

    /* ── Capture zone ─────────────────────────────── */
    .capture-zone {
      position: relative;
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .capture-zone:active { border-color: var(--accent); }
    .capture-zone.has-image { border-style: solid; border-color: var(--accent); }

    .capture-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--ink-2);
      pointer-events: none;
      padding: 24px;
    }

    .capture-icon {
      width: 76px;
      height: 76px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .capture-label {
      font-size: 1.17rem;      /* 21px */
      font-weight: 700;
      color: var(--ink);
    }

    .capture-sub {
      font-size: 1rem;         /* 18px */
      color: var(--ink-2);
      text-align: center;
      line-height: 1.5;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #fileInput { display: none; }

    /* ── Buttons ──────────────────────────────────── */
    .action-bar { display: flex; gap: 12px; }

    .btn {
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 1.11rem;      /* 20px */
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;           /* large tap target ~64px tall */
    }
    .btn:active { transform: scale(0.985); }

    .btn-primary {
      flex: 2;
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:active { background: var(--accent-press); }
    .btn-primary:disabled { background: #b8c2be; color: #eef0ee; cursor: not-allowed; }

    .btn-secondary {
      flex: 1;
      background: var(--card);
      color: var(--ink-2);
      border: 1.5px solid var(--line);
    }

    /* ── Result card ──────────────────────────────── */
    .result-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
      box-shadow: 0 2px 12px rgba(15, 31, 27, 0.06);
    }
    .result-card.visible { display: block; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Big glanceable amount at top of result */
    .amount-hero {
      padding: 22px 20px 18px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .amount-hero-label {
      font-size: 0.83rem;      /* 15px */
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-2);
      margin-bottom: 4px;
    }
    .amount-hero-value {
      font-size: 3rem;         /* 54px — readable across the room */
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .amount-hero-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(30, 125, 90, 0.1);
      padding: 6px 14px;
      border-radius: 100px;
    }

    .field-list { padding: 4px 0; }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 15px 20px;
      border-bottom: 1px solid var(--line);
      gap: 18px;
    }
    .field-row:last-child { border-bottom: none; }

    .field-key {
      font-size: 0.94rem;      /* 17px */
      font-weight: 600;
      color: var(--ink-2);
      flex-shrink: 0;
    }

    .field-val {
      font-size: 1.06rem;      /* 19px */
      font-weight: 600;
      color: var(--ink);
      text-align: right;
      word-break: break-word;
    }

    /* ── Processing overlay ───────────────────────── */
    .processing-overlay {
      position: fixed;
      inset: 0;
      background: rgba(238, 240, 238, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
    .processing-overlay.active { display: flex; }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-text {
      font-size: 1.11rem;      /* 20px */
      font-weight: 700;
      color: var(--ink);
    }

    /* ── Toast ────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--ink);
      color: #fff;
      border-radius: 100px;
      padding: 16px 26px;
      font-size: 1.06rem;      /* 19px */
      font-weight: 600;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 31, 27, 0.25);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--accent); }
    .toast.error { background: var(--red); }
  </style>
</head>
<body>

<header>
  <span class="title">Receipts</span>
  <span class="title-badge">Snap &amp; Save</span>
</header>

<main>
  <div class="section-label">Snap a receipt</div>
  <div class="capture-zone" id="captureZone" onclick="document.getElementById('fileInput').click()">
    <img id="preview" alt="Receipt preview" />
    <div class="capture-placeholder" id="placeholder">
      <div class="capture-icon">📷</div>
      <div class="capture-label">Tap to take a photo</div>
      <div class="capture-sub">Point at the receipt and snap,<br>or pick one from your library</div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImage(event)" />

  <div class="action-bar">
    <button class="btn btn-secondary" onclick="clearImage()">Clear</button>
    <button class="btn btn-primary" id="submitBtn" onclick="processReceipt()" disabled>
      Snap &amp; Save
    </button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="amount-hero">
      <div class="amount-hero-label">Total</div>
      <div class="amount-hero-value" id="heroAmount">$0.00</div>
      <div class="amount-hero-badge">✓ Saved to your sheet</div>
    </div>
    <div class="field-list" id="fieldList"></div>
  </div>
</main>

<div class="processing-overlay" id="overlay">
  <div class="spinner"></div>
  <div class="processing-text" id="overlayText">Reading receipt...</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─────────────────────────────────────────────────────
  // PASTE YOUR APPS SCRIPT WEB APP URL HERE
  // ─────────────────────────────────────────────────────
  const APPS_SCRIPT_URL = 'script.google.com/macros/s/AKfycbzSn2a1Hdbqw8E3WUFOFQ-OZetWj8mLAo3WFrv3NrRUIRnDap4vc1LNDnOtnIhbf7a_/exec';
  // ─────────────────────────────────────────────────────

  let currentImageBase64 = null;
  let currentMimeType = null;

  // ── Image handling ──────────────────────────────────
  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    currentMimeType = file.type || 'image/jpeg';

    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      currentImageBase64 = dataUrl.split(',')[1];

      document.getElementById('preview').src = dataUrl;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('captureZone').classList.add('has-image');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('resultCard').classList.remove('visible');
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    currentImageBase64 = null;
    currentMimeType = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('captureZone').classList.remove('has-image');
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('resultCard').classList.remove('visible');
    document.getElementById('fileInput').value = '';
  }

  // ── Process receipt ─────────────────────────────────
  async function processReceipt() {
    if (!currentImageBase64) return;

    if (APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
      showToast('Set your Apps Script URL first (see setup guide)', 'error');
      return;
    }

    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlayText');
    overlay.classList.add('active');

    const steps = ['Reading receipt...', 'Extracting details...', 'Saving to Drive...', 'Logging to Sheet...'];
    let step = 0;
    const stepInterval = setInterval(() => {
      step++;
      if (step < steps.length) overlayText.textContent = steps[step];
    }, 2000);

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          image: currentImageBase64,
          mimeType: currentMimeType
        }),
        headers: { 'Content-Type': 'text/plain' }
      });

      const result = await response.json();

      if (result.error) throw new Error(result.error);

      renderResult(result.data);
      showToast('Receipt saved ✓', 'success');

    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      clearInterval(stepInterval);
      overlay.classList.remove('active');
    }
  }

  // ── Render result ───────────────────────────────────
  function renderResult(data) {
    document.getElementById('heroAmount').textContent =
      data.total ? '$' + parseFloat(data.total).toFixed(2) : '—';

    const fields = [
      { key: 'Date', val: data.date || '—' },
      { key: 'Establishment', val: data.establishment || '—' },
      { key: 'Location', val: data.location || '—' },
      { key: 'Category', val: data.category || '—' },
    ];

    document.getElementById('fieldList').innerHTML = fields.map(f => `
      <div class="field-row">
        <span class="field-key">${f.key}</span>
        <span class="field-val">${f.val}</span>
      </div>
    `).join('');

    document.getElementById('resultCard').classList.add('visible');
  }

  // ── Toast ───────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
